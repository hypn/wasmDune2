<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune II</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #000; --fg: #e0b060; --panel: #2a1c08; --edge: #8a6420; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px monospace; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; }
  #status { position: fixed; left: 8px; bottom: 6px; opacity: .6; }
  #setup { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.75); }
  #setup form { background: var(--panel); border: 3px solid var(--edge); padding: 16px 20px; display: grid; grid-template-columns: auto auto; gap: 8px 14px; max-width: calc(100vw - 32px); }
  #setup h1 { grid-column: 1 / 3; margin: 0 0 6px; font-size: 18px; letter-spacing: 2px; }
  #setup label { align-self: center; }
  #setup select, #setup input, #setup button { font: inherit; background: #000; color: var(--fg); border: 1px solid var(--edge); padding: 2px 4px; }
  #setup .full { grid-column: 1 / 3; }
  #setup button { padding: 6px; cursor: pointer; }
  #setup fieldset { border: 1px dashed var(--edge); margin: 4px 0 0; padding: 4px 10px 8px; }
  #setup legend { padding: 0 4px; opacity: .8; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="status">Loading…</div>
<div id="setup">
  <form id="setupForm">
    <h1>DUNE II — SKIRMISH</h1>
    <label>Your house</label>
    <select name="house"><option value="1">Atreides</option><option value="0">Harkonnen</option><option value="2">Ordos</option></select>
    <label>Opponents</label>
    <span><label><input type="checkbox" name="opp0" checked> Harkonnen</label>
      <label><input type="checkbox" name="opp1"> Atreides</label>
      <label><input type="checkbox" name="opp2"> Ordos</label>
      <label><input type="checkbox" name="opp4"> Sardaukar</label></span>
    <label>Alliance</label>
    <select name="allied"><option value="1">Computers allied (original)</option><option value="0">Free for all</option></select>
    <label>Map seed</label>
    <span><input name="seed" type="number" min="0" max="32767" value="27" style="width:7em"> <button type="button" id="rnd">Random</button></span>
    <label>Map size</label>
    <select name="scale"><option value="0">Large (62×62)</option><option value="1">Small (32×32)</option></select>
    <label>Credits</label>
    <select name="credits"><option>1000</option><option selected>1500</option><option>3000</option><option>5000</option><option>10000</option></select>
    <label>Tech level</label>
    <select name="tech"><option value="9" selected>9 (everything)</option><option value="7">7</option><option value="5">5</option><option value="3">3</option><option value="2">2</option></select>
    <label>Computer skill</label>
    <select name="diff"><option value="0">Easy</option><option value="1" selected>Normal</option><option value="2">Hard</option></select>
    <label>Starting units</label>
    <select name="force"><option value="0">MCV only</option><option value="1" selected>MCV + light force</option><option value="2">MCV + medium force</option></select>
    <label>Game speed</label>
    <select name="speed"><option value="0">Slowest</option><option value="1">Slower</option><option value="2">Normal</option><option value="3">Faster</option><option value="4" selected>Fastest</option></select>
    <label>Turbo</label>
    <select name="turbo"><option value="100">1× (original pace)</option><option value="150">1.5×</option><option value="200" selected>2×</option><option value="300">3×</option><option value="400">4×</option></select>
    <label>Bug fixes</label>
    <select name="enh"><option value="1" selected>OpenDUNE fixes on</option><option value="0">Exactly original (with bugs)</option></select>
    <label>Right click</label>
    <select name="rclick"><option value="0">Original (same as left click)</option><option value="1">Cancel / deselect</option><option value="5" selected>Orders (move / attack / harvest)</option></select>
    <label>Hints</label>
    <select name="hints"><option value="0">Show (original)</option><option value="2" selected>Hide</option></select>
    <fieldset class="full"><legend>DEBUG</legend>
      <label><input type="checkbox" name="nofog"> No fog of war</label>
    </fieldset>
    <button class="full" type="submit">START</button>
  </form>
</div>
<script type="module" src="main.js"></script>
</body>
</html>
