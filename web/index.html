<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dune II Shareware</title>
<link rel="icon" href="data:,">
<style>
  :root { --bg: #000; --fg: #e0b060; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 14px monospace; }
  body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
  canvas { image-rendering: pixelated; image-rendering: crisp-edges; cursor: none; }
  /* The cursor is the game's own, clamped to the screen edges, so hide the OS one everywhere. */
  body { cursor: none; }
  #status { position: fixed; left: 8px; bottom: 6px; opacity: .6; }
</style>
</head>
<body>
<canvas id="screen" width="320" height="200"></canvas>
<div id="status">Loading…</div>
<script type="module" src="main.js"></script>
</body>
