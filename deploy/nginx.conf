# Example nginx server block in front of the container (certbot/Let's Encrypt manages the cert lines).
server {
    listen 443 ssl http2;
    server_name dune.example.com;

    # ssl_certificate     /etc/letsencrypt/live/dune.example.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/dune.example.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_set_header Host $host;

        # Always revalidate, so updated game files / builds are picked up (busybox httpd sends
        # Last-Modified, so unchanged files cost only a 304).
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; object-src 'none'; base-uri 'none'; frame-ancestors 'none'" always;

        gzip on;
        gzip_types application/wasm application/octet-stream text/javascript;
    }
}
